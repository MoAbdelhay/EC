# Builds the iOS app on a GitHub-hosted Mac (Windows cannot compile iOS apps).
# Runs on every push to main and on demand (Actions tab → iOS build → Run workflow).
# This job checks that the app compiles for the iOS simulator; it does not sign or upload.
# For App Store releases see "iOS release" in README.md.
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web bundle from src/calculator.html
        run: npm run build:web

      - run: npx cap sync ios

      - name: Compile for the iOS simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
